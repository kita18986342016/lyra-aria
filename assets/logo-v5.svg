<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 深空背景 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1733"/>
      <stop offset="0.4" stop-color="#16224e"/>
      <stop offset="0.75" stop-color="#2b1c5a"/>
      <stop offset="1" stop-color="#41185f"/>
    </linearGradient>
    <!-- 主折线渐变 -->
    <linearGradient id="wm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8fe0"/>
      <stop offset="0.45" stop-color="#7ec8ff"/>
      <stop offset="0.8" stop-color="#cfe9ff"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <!-- 副折线渐变（紫） -->
    <linearGradient id="ws" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6a4cd8"/>
      <stop offset="0.6" stop-color="#9d8bff"/>
      <stop offset="1" stop-color="#d8c8ff"/>
    </linearGradient>
    <!-- 星云（多色） -->
    <radialGradient id="nebA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d7fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#4d7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebD" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0a85a" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f0a85a" stop-opacity="0"/>
    </radialGradient>
    <!-- 银河带渐变（外晕层：宽而淡） -->
    <linearGradient id="milky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db8ff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#cfe0ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#9db8ff" stop-opacity="0.03"/>
    </linearGradient>
    <!-- 银河中心渐变（内层：窄而略亮，与晕层叠加成自然衰减） -->
    <linearGradient id="milkyInner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dceaff" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#f0f6ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#dceaff" stop-opacity="0.03"/>
    </linearGradient>
    <!-- 主星光晕 -->
    <radialGradient id="haloA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffe9b8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <!-- 转折点光晕 -->
    <radialGradient id="dotH" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dff2ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#dff2ff" stop-opacity="0"/>
    </radialGradient>
    <!-- 倒影渐隐 -->
    <linearGradient id="fadeM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="refMask">
      <rect x="0" y="360" width="512" height="152" fill="url(#fadeM)"/>
    </mask>
    <filter id="blurL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blurInner" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- 深空底：全画布深空渐变（供几何抠角：圆角外同为深空色，无白边） -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- 深空圆角底 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ===== 银河尘埃带（双层：宽晕 + 中心光，边缘自然衰减） ===== -->
  <g opacity="0.9">
    <path d="M-30 140 Q 200 230 540 330" fill="none" stroke="url(#milky)" stroke-width="150" filter="url(#blurM)"/>
    <path d="M-30 140 Q 200 230 540 330" fill="none" stroke="url(#milkyInner)" stroke-width="60" filter="url(#blurInner)"/>
  </g>

  <!-- ===== 星云团（堆砌） ===== -->
  <circle cx="100" cy="105" r="160" fill="url(#nebA)"/>
  <circle cx="415" cy="300" r="180" fill="url(#nebB)"/>
  <circle cx="265" cy="55" r="120" fill="url(#nebC)" opacity="0.75"/>
  <circle cx="55" cy="330" r="140" fill="url(#nebB)" opacity="0.5"/>
  <circle cx="470" cy="120" r="110" fill="url(#nebA)" opacity="0.6"/>
  <circle cx="60" cy="250" r="90" fill="url(#nebD)"/>
  <circle cx="340" cy="470" r="130" fill="url(#nebC)" opacity="0.5"/>

  <!-- ===== 星点群（45 颗 + 微尘） ===== -->
  <g fill="#ffffff">
    <circle cx="88" cy="78" r="3" opacity="0.9"/>
    <circle cx="188" cy="50" r="2" opacity="0.6"/>
    <circle cx="308" cy="62" r="2.5" opacity="0.7"/>
    <circle cx="462" cy="108" r="2" opacity="0.5"/>
    <circle cx="480" cy="228" r="3" opacity="0.8"/>
    <circle cx="54" cy="198" r="2" opacity="0.6"/>
    <circle cx="148" cy="148" r="2" opacity="0.5"/>
    <circle cx="358" cy="128" r="1.8" opacity="0.55"/>
    <circle cx="428" cy="46" r="2.5" opacity="0.65"/>
    <circle cx="62" cy="288" r="2" opacity="0.5"/>
    <circle cx="238" cy="286" r="1.8" opacity="0.45"/>
    <circle cx="500" cy="368" r="2" opacity="0.6"/>
    <circle cx="298" cy="482" r="2.5" opacity="0.5"/>
    <circle cx="118" cy="482" r="2" opacity="0.55"/>
    <circle cx="432" cy="482" r="2" opacity="0.45"/>
    <circle cx="198" cy="420" r="1.8" opacity="0.5"/>
    <circle cx="330" cy="330" r="1.6" opacity="0.45"/>
    <circle cx="150" cy="240" r="1.6" opacity="0.4"/>
    <circle cx="470" cy="160" r="1.8" opacity="0.55"/>
    <circle cx="40" cy="130" r="1.8" opacity="0.5"/>
    <circle cx="250" cy="150" r="1.5" opacity="0.45"/>
    <circle cx="320" cy="90" r="1.8" opacity="0.5"/>
    <circle cx="440" cy="250" r="1.6" opacity="0.45"/>
    <circle cx="70" cy="160" r="1.6" opacity="0.5"/>
    <circle cx="380" cy="330" r="1.5" opacity="0.4"/>
    <circle cx="160" cy="330" r="1.6" opacity="0.45"/>
    <circle cx="290" cy="210" r="1.4" opacity="0.4"/>
    <circle cx="495" cy="60" r="2" opacity="0.55"/>
    <circle cx="30" cy="60" r="2" opacity="0.55"/>
  </g>
  <!-- 微尘星群（银河颗粒） -->
  <g fill="#ffffff">
    <circle cx="140" cy="120" r="1" opacity="0.3"/>
    <circle cx="170" cy="135" r="0.9" opacity="0.25"/>
    <circle cx="190" cy="110" r="1" opacity="0.3"/>
    <circle cx="220" cy="140" r="0.8" opacity="0.22"/>
    <circle cx="260" cy="120" r="1" opacity="0.28"/>
    <circle cx="300" cy="105" r="0.9" opacity="0.25"/>
    <circle cx="330" cy="135" r="1" opacity="0.3"/>
    <circle cx="360" cy="115" r="0.8" opacity="0.22"/>
    <circle cx="420" cy="140" r="1" opacity="0.28"/>
    <circle cx="450" cy="125" r="0.9" opacity="0.25"/>
    <circle cx="120" cy="200" r="0.9" opacity="0.2"/>
    <circle cx="350" cy="200" r="0.9" opacity="0.2"/>
    <circle cx="480" cy="300" r="0.9" opacity="0.22"/>
    <circle cx="40" cy="240" r="0.9" opacity="0.2"/>
  </g>
  <!-- 金色星点 -->
  <g fill="#ffe9b8">
    <circle cx="174" cy="100" r="2" opacity="0.75"/>
    <circle cx="340" cy="236" r="2" opacity="0.6"/>
    <circle cx="86" cy="352" r="2" opacity="0.5"/>
    <circle cx="474" cy="318" r="1.8" opacity="0.55"/>
    <circle cx="120" cy="180" r="1.8" opacity="0.6"/>
    <circle cx="240" cy="60" r="1.8" opacity="0.55"/>
    <circle cx="455" cy="200" r="1.6" opacity="0.5"/>
  </g>
  <!-- 淡紫星点 -->
  <g fill="#d8c8ff">
    <circle cx="200" cy="200" r="1.8" opacity="0.5"/>
    <circle cx="420" cy="60" r="1.6" opacity="0.5"/>
    <circle cx="50" cy="110" r="1.6" opacity="0.45"/>
    <circle cx="360" cy="440" r="1.6" opacity="0.4"/>
  </g>
  <!-- 十字闪光星（4 颗） -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <circle cx="118" cy="208" r="3.2"/>
      <line x1="118" y1="199" x2="118" y2="217" stroke="#ffffff" stroke-width="1.4" opacity="0.8"/>
      <line x1="109" y1="208" x2="127" y2="208" stroke="#ffffff" stroke-width="1.4" opacity="0.8"/>
    </g>
    <g opacity="0.9">
      <circle cx="392" cy="326" r="2.6"/>
      <line x1="392" y1="319" x2="392" y2="333" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="385" y1="326" x2="399" y2="326" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    </g>
    <g opacity="0.85">
      <circle cx="58" cy="96" r="2.4"/>
      <line x1="58" y1="89" x2="58" y2="103" stroke="#ffffff" stroke-width="1.1" opacity="0.65"/>
      <line x1="51" y1="96" x2="65" y2="96" stroke="#ffffff" stroke-width="1.1" opacity="0.65"/>
    </g>
    <g opacity="0.85">
      <circle cx="478" cy="180" r="2.4"/>
      <line x1="478" y1="173" x2="478" y2="187" stroke="#ffffff" stroke-width="1.1" opacity="0.65"/>
      <line x1="471" y1="180" x2="485" y2="180" stroke="#ffffff" stroke-width="1.1" opacity="0.65"/>
    </g>
  </g>
  <!-- 流星 -->
  <path d="M52 52 L90 70" stroke="#cfe9ff" stroke-width="1.4" stroke-linecap="round" opacity="0.5"/>
  <path d="M446 36 L470 52" stroke="#ffe9b8" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  <path d="M30 300 L58 316" stroke="#cfe9ff" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- ===== 星座 1：天琴座（左上） ===== -->
  <g stroke="#d5ecff" stroke-width="1.2" opacity="0.65" stroke-dasharray="2 4" fill="none">
    <path d="M210 96 L186 138 L210 170 L234 138 Z"/>
    <line x1="210" y1="96" x2="210" y2="170"/>
  </g>
  <g fill="#d5ecff">
    <circle cx="210" cy="96" r="3.2"/>
    <circle cx="186" cy="138" r="2.4"/>
    <circle cx="210" cy="170" r="2.4"/>
    <circle cx="234" cy="138" r="2.4"/>
  </g>
  <!-- ===== 星座 2：仙后座 W（右上） ===== -->
  <g stroke="#e8d5ff" stroke-width="1" opacity="0.5" stroke-dasharray="2 4" fill="none">
    <path d="M420 60 L438 84 L452 66 L468 92 L486 72"/>
  </g>
  <g fill="#e8d5ff">
    <circle cx="420" cy="60" r="2.2"/>
    <circle cx="438" cy="84" r="2.2"/>
    <circle cx="452" cy="66" r="2"/>
    <circle cx="468" cy="92" r="2.2"/>
    <circle cx="486" cy="72" r="2"/>
  </g>

  <!-- 水面 -->
  <line x1="56" y1="360" x2="456" y2="360" stroke="#8fd0ff" stroke-width="1.6" opacity="0.4"/>
  <line x1="56" y1="367" x2="456" y2="367" stroke="#8fd0ff" stroke-width="0.8" opacity="0.18"/>
  <g stroke="#8fd0ff" stroke-width="1" fill="none" opacity="0.22">
    <path d="M110 382 q 14 -5 28 0"/>
    <path d="M300 394 q 14 -5 28 0"/>
    <path d="M170 410 q 12 -4 24 0"/>
    <path d="M390 414 q 12 -4 24 0"/>
    <path d="M240 430 q 10 -3 20 0"/>
    <path d="M60 400 q 10 -3 20 0"/>
  </g>

  <!-- ===== 主体：律动折线组（幅度 v2-v4 之间） ===== -->
  <g id="waveGroup">
    <!-- 回声虚线 1（主旋律回声·金） -->
    <path d="M100 386 L154 308 L214 352 L280 240 L338 310 L400 184"
          fill="none" stroke="#ffd9a0" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.35"/>
    <!-- 回声虚线 2（副旋律回声·青） -->
    <path d="M78 384 L136 334 L198 376 L268 272 L330 340 L396 220"
          fill="none" stroke="#9adcff" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="2 9" opacity="0.28"/>
    <!-- 宽光晕带 -->
    <path d="M100 360 L154 282 L214 326 L280 214 L338 284 L400 158"
          fill="none" stroke="url(#wm)" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" opacity="0.13"/>
    <!-- 副旋律 1（紫） -->
    <path d="M78 360 L136 310 L198 352 L268 248 L330 316 L396 196"
          fill="none" stroke="url(#ws)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- 副旋律 2（青泛音） -->
    <path d="M148 360 L206 322 L260 362 L326 276 L386 330 L436 236"
          fill="none" stroke="#9adcff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <!-- 主旋律 -->
    <path d="M100 360 L154 282 L214 326 L280 214 L338 284 L400 158"
          fill="none" stroke="url(#wm)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 主旋律高光 -->
    <path d="M100 360 L154 282 L214 326 L280 214 L338 284 L400 158"
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    <!-- 转折点光点 -->
    <g fill="#ffffff">
      <circle cx="154" cy="282" r="5" opacity="0.95"/>
      <circle cx="214" cy="326" r="3.5" opacity="0.7"/>
      <circle cx="280" cy="214" r="6" opacity="0.95"/>
      <circle cx="338" cy="284" r="3.5" opacity="0.7"/>
    </g>
    <g fill="#cfe9ff">
      <circle cx="136" cy="310" r="3" opacity="0.7"/>
      <circle cx="268" cy="248" r="3.5" opacity="0.8"/>
      <circle cx="326" cy="276" r="2.8" opacity="0.7"/>
    </g>
    <g fill="url(#dotH)">
      <circle cx="154" cy="282" r="11" opacity="0.5"/>
      <circle cx="280" cy="214" r="13" opacity="0.55"/>
    </g>
  </g>

  <!-- 倒影 -->
  <g transform="matrix(1 0 0 -1 0 720)" filter="url(#blurL)" mask="url(#refMask)">
    <use href="#waveGroup"/>
  </g>

  <!-- ===== 主星（织女星 · 16 芒） ===== -->
  <g>
    <circle cx="400" cy="146" r="60" fill="url(#haloB)" filter="url(#blurS)"/>
    <circle cx="400" cy="146" r="46" fill="url(#haloA)"/>
    <!-- 外圈细环（精致感） -->
    <circle cx="400" cy="146" r="22" fill="none" stroke="#ffe9b8" stroke-width="1" opacity="0.35"/>
    <g stroke="#ffe9b8" stroke-linecap="round">
      <line x1="400" y1="88" x2="400" y2="108" stroke-width="4.5" opacity="0.95"/>
      <line x1="400" y1="184" x2="400" y2="204" stroke-width="4.5" opacity="0.95"/>
      <line x1="344" y1="146" x2="364" y2="146" stroke-width="4.5" opacity="0.95"/>
      <line x1="436" y1="146" x2="456" y2="146" stroke-width="4.5" opacity="0.95"/>
      <line x1="361" y1="107" x2="374" y2="120" stroke-width="2.8" opacity="0.85"/>
      <line x1="426" y1="107" x2="439" y2="120" stroke-width="2.8" opacity="0.85"/>
      <line x1="361" y1="185" x2="374" y2="172" stroke-width="2.8" opacity="0.85"/>
      <line x1="426" y1="185" x2="439" y2="172" stroke-width="2.8" opacity="0.85"/>
      <line x1="377" y1="94" x2="385" y2="104" stroke-width="2" opacity="0.7"/>
      <line x1="415" y1="94" x2="423" y2="104" stroke-width="2" opacity="0.7"/>
      <line x1="377" y1="198" x2="385" y2="188" stroke-width="2" opacity="0.7"/>
      <line x1="415" y1="198" x2="423" y2="188" stroke-width="2" opacity="0.7"/>
      <line x1="354" y1="128" x2="362" y2="135" stroke-width="2" opacity="0.7"/>
      <line x1="438" y1="128" x2="446" y2="135" stroke-width="2" opacity="0.7"/>
      <line x1="354" y1="164" x2="362" y2="157" stroke-width="2" opacity="0.7"/>
      <line x1="438" y1="164" x2="446" y2="157" stroke-width="2" opacity="0.7"/>
    </g>
    <circle cx="400" cy="146" r="13" fill="#ffe9b8"/>
    <circle cx="400" cy="146" r="8" fill="#fff0cd"/>
    <circle cx="396" cy="142" r="3.5" fill="#fffdf4"/>
    <path d="M414 156 Q 434 188 448 222" fill="none" stroke="#ffe9b8" stroke-width="1.6" stroke-dasharray="3 6" opacity="0.45"/>
  </g>
</svg>
