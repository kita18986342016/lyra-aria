<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 深空背景（再提亮一档：更亮更饱和，小尺寸更显眼） -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243a6e"/>
      <stop offset="0.4" stop-color="#365491"/>
      <stop offset="0.75" stop-color="#5a48a6"/>
      <stop offset="1" stop-color="#8a42b8"/>
    </linearGradient>
    <!-- 主折线渐变（再提亮） -->
    <linearGradient id="wm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5da8ff"/>
      <stop offset="0.45" stop-color="#a5e2ff"/>
      <stop offset="0.8" stop-color="#f4fbff"/>
      <stop offset="1" stop-color="#ffe9b8"/>
    </linearGradient>
    <!-- 副折线渐变（紫，提亮） -->
    <linearGradient id="ws" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6ae8"/>
      <stop offset="0.6" stop-color="#b4a4ff"/>
      <stop offset="1" stop-color="#e8dcff"/>
    </linearGradient>
    <!-- 星云 -->
    <radialGradient id="nebA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b06bff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
    <!-- 银河带 -->
    <linearGradient id="milky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c2ff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#d8e8ff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#a9c2ff" stop-opacity="0.06"/>
    </linearGradient>
    <!-- 主星光晕 -->
    <radialGradient id="haloA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7e0" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#ffe9b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurM" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="round"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <!-- 深空圆角底（透明四角） -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 其余内容全部裁剪进圆角，防止星云/光晕渗出四角 -->
  <g clip-path="url(#round)">

  <!-- 银河尘埃带（柔和） -->
  <path d="M-30 140 Q 200 230 540 330" fill="none" stroke="url(#milky)" stroke-width="150" filter="url(#blurM)"/>

  <!-- 星云（少量大团，小尺寸下是柔和光晕） -->
  <circle cx="100" cy="105" r="170" fill="url(#nebA)"/>
  <circle cx="420" cy="310" r="180" fill="url(#nebB)"/>
  <circle cx="60" cy="330" r="140" fill="url(#nebB)" opacity="0.6"/>
  <circle cx="470" cy="110" r="120" fill="url(#nebA)" opacity="0.7"/>

  <!-- 大星点（少量、够亮，缩到 16px 仍可见） -->
  <g fill="#ffffff">
    <circle cx="88" cy="78" r="3.5" opacity="0.95"/>
    <circle cx="462" cy="108" r="3" opacity="0.85"/>
    <circle cx="480" cy="228" r="3.2" opacity="0.9"/>
    <circle cx="54" cy="198" r="2.8" opacity="0.85"/>
    <circle cx="358" cy="128" r="2.6" opacity="0.8"/>
    <circle cx="428" cy="46" r="3" opacity="0.85"/>
    <circle cx="62" cy="288" r="2.6" opacity="0.8"/>
    <circle cx="500" cy="368" r="2.6" opacity="0.8"/>
    <circle cx="118" cy="482" r="2.8" opacity="0.8"/>
    <circle cx="432" cy="482" r="2.5" opacity="0.75"/>
  </g>
  <g fill="#ffe9b8">
    <circle cx="174" cy="100" r="3" opacity="0.9"/>
    <circle cx="340" cy="236" r="2.6" opacity="0.8"/>
    <circle cx="86" cy="352" r="2.5" opacity="0.75"/>
    <circle cx="474" cy="318" r="2.5" opacity="0.8"/>
    <circle cx="240" cy="60" r="2.6" opacity="0.8"/>
  </g>
  <!-- 十字闪光星 2 颗 -->
  <g fill="#ffffff">
    <g opacity="0.95"><circle cx="118" cy="208" r="3.6"/><line x1="118" y1="197" x2="118" y2="219" stroke="#ffffff" stroke-width="1.8" opacity="0.85"/><line x1="107" y1="208" x2="129" y2="208" stroke="#ffffff" stroke-width="1.8" opacity="0.85"/></g>
    <g opacity="0.9"><circle cx="392" cy="326" r="3"/><line x1="392" y1="317" x2="392" y2="335" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/><line x1="383" y1="326" x2="401" y2="326" stroke="#ffffff" stroke-width="1.5" opacity="0.75"/></g>
  </g>

  <!-- ===== 主体：粗折线（加粗加亮版） ===== -->
  <g id="waveGroup">
    <!-- 宽光晕带 -->
    <path d="M100 360 L154 282 L214 326 L280 214 L338 284 L400 158"
          fill="none" stroke="url(#wm)" stroke-width="76" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>
    <!-- 副旋律 1（紫） -->
    <path d="M78 360 L136 310 L198 352 L268 248 L330 316 L396 196"
          fill="none" stroke="url(#ws)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <!-- 主旋律（34px 粗线） -->
    <path d="M100 360 L154 282 L214 326 L280 214 L338 284 L400 158"
          fill="none" stroke="url(#wm)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 主旋律高光 -->
    <path d="M100 360 L154 282 L214 326 L280 214 L338 284 L400 158"
          fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
    <!-- 转折点光点（加大） -->
    <g fill="#ffffff">
      <circle cx="154" cy="282" r="11" opacity="0.95"/>
      <circle cx="214" cy="326" r="8" opacity="0.75"/>
      <circle cx="280" cy="214" r="13" opacity="0.95"/>
      <circle cx="338" cy="284" r="8" opacity="0.75"/>
    </g>
    <g fill="url(#haloA)">
      <circle cx="154" cy="282" r="20" opacity="0.5"/>
      <circle cx="280" cy="214" r="24" opacity="0.55"/>
    </g>
  </g>

  <!-- ===== 主星（织女星 · 放大） ===== -->
  <g>
    <circle cx="400" cy="146" r="88" fill="url(#haloB)" filter="url(#blurS)"/>
    <circle cx="400" cy="146" r="56" fill="url(#haloA)"/>
    <circle cx="400" cy="146" r="26" fill="none" stroke="#ffe9b8" stroke-width="1.4" opacity="0.45"/>
    <g stroke="#ffe9b8" stroke-linecap="round">
      <line x1="400" y1="82" x2="400" y2="104" stroke-width="6" opacity="0.95"/>
      <line x1="400" y1="188" x2="400" y2="210" stroke-width="6" opacity="0.95"/>
      <line x1="338" y1="146" x2="360" y2="146" stroke-width="6" opacity="0.95"/>
      <line x1="440" y1="146" x2="462" y2="146" stroke-width="6" opacity="0.95"/>
      <line x1="356" y1="103" x2="370" y2="117" stroke-width="3.6" opacity="0.85"/>
      <line x1="430" y1="103" x2="444" y2="117" stroke-width="3.6" opacity="0.85"/>
      <line x1="356" y1="189" x2="370" y2="175" stroke-width="3.6" opacity="0.85"/>
      <line x1="430" y1="189" x2="444" y2="175" stroke-width="3.6" opacity="0.85"/>
    </g>
    <circle cx="400" cy="146" r="18" fill="#ffe9b8"/>
    <circle cx="400" cy="146" r="11" fill="#fff0cd"/>
    <circle cx="395" cy="141" r="4.5" fill="#fffdf4"/>
  </g>
  </g>
</svg>
