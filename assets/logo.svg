<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16264a"/>
      <stop offset="0.55" stop-color="#232a63"/>
      <stop offset="1" stop-color="#3a1e5f"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6fb6f2"/>
      <stop offset="0.55" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深空圆角底 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 星点 -->
  <circle cx="118" cy="118" r="4" fill="#ffffff" opacity="0.85"/>
  <circle cx="402" cy="96" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="84" cy="320" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="440" cy="310" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="330" cy="168" r="2.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="150" cy="230" r="2.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="252" cy="120" r="2" fill="#ffffff" opacity="0.45"/>
  <circle cx="180" cy="448" r="3" fill="#ffffff" opacity="0.4"/>
  <circle cx="390" cy="420" r="2.5" fill="#ffffff" opacity="0.5"/>

  <!-- 折叠声波：柔和光晕带 -->
  <path d="M128 402 L192 336 L256 372 L320 268 L384 316 L430 210"
        fill="none" stroke="url(#wave)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" opacity="0.16"/>

  <!-- 折叠声波主线（折韵） -->
  <path d="M128 402 L192 336 L256 372 L320 268 L384 316 L430 210"
        fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 折线高光 -->
  <path d="M128 402 L192 336 L256 372 L320 268 L384 316 L430 210"
        fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.22"/>

  <!-- 顶端主星（织女星）：光晕 + 星体 + 光芒 -->
  <circle cx="430" cy="190" r="30" fill="url(#halo)"/>
  <circle cx="430" cy="190" r="11" fill="#ffe9b8"/>
  <g stroke="#ffe9b8" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
    <line x1="430" y1="160" x2="430" y2="172"/>
    <line x1="430" y1="208" x2="430" y2="220"/>
    <line x1="400" y1="190" x2="412" y2="190"/>
    <line x1="448" y1="190" x2="460" y2="190"/>
  </g>

  <!-- 底部一缕余韵（短促收尾线） -->
  <path d="M128 402 L150 380" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
</svg>
