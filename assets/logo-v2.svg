<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 深空背景渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1b3d"/>
      <stop offset="0.5" stop-color="#1c2a5e"/>
      <stop offset="1" stop-color="#3a1e5f"/>
    </linearGradient>
    <!-- 主体折线渐变：蓝→青→金 -->
    <linearGradient id="waveMain" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4f9fe8"/>
      <stop offset="0.5" stop-color="#7ec8ff"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="waveSub" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5cf0"/>
      <stop offset="0.55" stop-color="#9d8bff"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
    <!-- 主星光晕 -->
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffe9b8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <!-- 星云光斑 -->
    <radialGradient id="neb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b06bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b06bff" stop-opacity="0"/>
    </radialGradient>
    <!-- 倒影渐隐遮罩：水面线以下从上到下淡出 -->
    <linearGradient id="fadeM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="refMask">
      <rect x="0" y="336" width="512" height="176" fill="url(#fadeM)"/>
    </mask>
    <!-- 倒影模糊 -->
    <filter id="blurLite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <!-- 转折点光点光晕 -->
    <radialGradient id="dotHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfeaff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#cfeaff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 深空圆角底 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 星云光斑 -->
  <circle cx="120" cy="120" r="130" fill="url(#neb1)"/>
  <circle cx="420" cy="300" r="150" fill="url(#neb2)"/>
  <circle cx="250" cy="80" r="90" fill="url(#neb1)" opacity="0.6"/>

  <!-- 星点群 -->
  <g fill="#ffffff">
    <circle cx="96" cy="92" r="3" opacity="0.9"/>
    <circle cx="196" cy="60" r="2" opacity="0.6"/>
    <circle cx="316" cy="74" r="2.5" opacity="0.7"/>
    <circle cx="450" cy="120" r="2" opacity="0.55"/>
    <circle cx="470" cy="220" r="3" opacity="0.8"/>
    <circle cx="60" cy="210" r="2" opacity="0.6"/>
    <circle cx="150" cy="160" r="2" opacity="0.5"/>
    <circle cx="360" cy="140" r="2" opacity="0.55"/>
    <circle cx="420" cy="52" r="2.5" opacity="0.65"/>
    <circle cx="70" cy="300" r="2" opacity="0.5"/>
    <circle cx="240" cy="300" r="2" opacity="0.45"/>
    <circle cx="490" cy="380" r="2" opacity="0.6"/>
    <circle cx="300" cy="470" r="2.5" opacity="0.5"/>
    <circle cx="120" cy="470" r="2" opacity="0.55"/>
    <circle cx="420" cy="470" r="2" opacity="0.45"/>
  </g>
  <!-- 少量金色星点 -->
  <g fill="#ffe9b8">
    <circle cx="180" cy="110" r="2" opacity="0.75"/>
    <circle cx="330" cy="250" r="2" opacity="0.6"/>
    <circle cx="90" cy="380" r="2" opacity="0.5"/>
  </g>

  <!-- ===== 律动折线组（主体，从水面向上律动） ===== -->
  <g id="waveGroup">
    <!-- 弱背景律动（最宽最淡） -->
    <path d="M84 336 L142 254 L202 286 L264 196 L322 232 L396 104"
          fill="none" stroke="url(#waveMain)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" opacity="0.18"/>
    <!-- 副旋律（和声，紫系，相位错开） -->
    <path d="M120 336 L176 296 L236 328 L300 238 L356 274 L418 150"
          fill="none" stroke="url(#waveSub)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
    <!-- 主旋律（亮，蓝→金） -->
    <path d="M96 336 L150 268 L210 300 L272 210 L330 246 L400 118"
          fill="none" stroke="url(#waveMain)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 主旋律高光 -->
    <path d="M96 336 L150 268 L210 300 L272 210 L330 246 L400 118"
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.28"/>
    <!-- 转折点光点（律动节点） -->
    <g fill="#ffffff">
      <circle cx="150" cy="268" r="5" opacity="0.95"/>
      <circle cx="210" cy="300" r="4" opacity="0.7"/>
      <circle cx="272" cy="210" r="5.5" opacity="0.95"/>
      <circle cx="330" cy="246" r="4" opacity="0.7"/>
    </g>
    <g fill="url(#dotHalo)">
      <circle cx="150" cy="268" r="10" opacity="0.5"/>
      <circle cx="272" cy="210" r="11" opacity="0.5"/>
    </g>
  </g>

  <!-- ===== 水面镜面线 ===== -->
  <line x1="60" y1="336" x2="452" y2="336" stroke="#8fd0ff" stroke-width="1.5" opacity="0.35"/>
  <line x1="60" y1="342" x2="452" y2="342" stroke="#8fd0ff" stroke-width="0.8" opacity="0.18"/>

  <!-- ===== 倒影（镜像 + 模糊 + 渐隐遮罩） ===== -->
  <g transform="matrix(1 0 0 -1 0 672)" filter="url(#blurLite)" mask="url(#refMask)">
    <use href="#waveGroup"/>
  </g>

  <!-- ===== 顶端主星（织女星） ===== -->
  <g>
    <!-- 大光晕 -->
    <circle cx="400" cy="96" r="52" fill="url(#halo)"/>
    <!-- 星芒 -->
    <g stroke="#ffe9b8" stroke-linecap="round" opacity="0.95">
      <line x1="400" y1="52" x2="400" y2="70" stroke-width="4"/>
      <line x1="400" y1="122" x2="400" y2="140" stroke-width="4"/>
      <line x1="348" y1="96" x2="366" y2="96" stroke-width="4"/>
      <line x1="434" y1="96" x2="452" y2="96" stroke-width="4"/>
      <line x1="363" y1="59" x2="375" y2="71" stroke-width="2.5"/>
      <line x1="425" y1="59" x2="437" y2="71" stroke-width="2.5"/>
      <line x1="363" y1="133" x2="375" y2="121" stroke-width="2.5"/>
      <line x1="425" y1="133" x2="437" y2="121" stroke-width="2.5"/>
    </g>
    <!-- 星体 -->
    <circle cx="400" cy="96" r="12" fill="#ffe9b8"/>
    <circle cx="396" cy="92" r="4" fill="#fff8e6"/>
    <!-- 星轨（向右下的淡弧，呼应"韵"） -->
    <path d="M412 104 Q 436 138 452 172" fill="none" stroke="#ffe9b8" stroke-width="1.6" stroke-dasharray="3 6" opacity="0.5"/>
  </g>
</svg>
