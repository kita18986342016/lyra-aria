<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- 深空背景 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1836"/>
      <stop offset="0.42" stop-color="#182552"/>
      <stop offset="0.78" stop-color="#2e1e5e"/>
      <stop offset="1" stop-color="#451a66"/>
    </linearGradient>
    <!-- 主折线渐变 -->
    <linearGradient id="wm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8fe0"/>
      <stop offset="0.45" stop-color="#7ec8ff"/>
      <stop offset="0.8" stop-color="#cfe9ff"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <!-- 副折线渐变（紫） -->
    <linearGradient id="ws" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6a4cd8"/>
      <stop offset="0.6" stop-color="#9d8bff"/>
      <stop offset="1" stop-color="#d8c8ff"/>
    </linearGradient>
    <!-- 声波带渐变（fill 带） -->
    <linearGradient id="band" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3f8fe0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5aa8f5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0.16"/>
    </linearGradient>
    <!-- 星云 -->
    <radialGradient id="nebA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4d7fff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#4d7fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <!-- 主星光晕（3 层） -->
    <radialGradient id="haloA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dd" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ffe9b8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haloB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffe9b8" stop-opacity="0"/>
    </radialGradient>
    <!-- 转折点光晕 -->
    <radialGradient id="dotH" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#dff2ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#dff2ff" stop-opacity="0"/>
    </radialGradient>
    <!-- 倒影渐隐 -->
    <linearGradient id="fadeM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="refMask">
      <rect x="0" y="350" width="512" height="162" fill="url(#fadeM)"/>
    </mask>
    <filter id="blurL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="blurS" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- 深空底 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 星云光斑 -->
  <circle cx="112" cy="120" r="150" fill="url(#nebA)"/>
  <circle cx="400" cy="300" r="170" fill="url(#nebB)"/>
  <circle cx="260" cy="70" r="110" fill="url(#nebC)" opacity="0.7"/>
  <circle cx="70" cy="380" r="120" fill="url(#nebB)" opacity="0.5"/>

  <!-- 星点群（普通星点） -->
  <g fill="#ffffff">
    <circle cx="90" cy="80" r="3" opacity="0.9"/>
    <circle cx="190" cy="52" r="2" opacity="0.6"/>
    <circle cx="310" cy="64" r="2.5" opacity="0.7"/>
    <circle cx="460" cy="110" r="2" opacity="0.5"/>
    <circle cx="478" cy="230" r="3" opacity="0.8"/>
    <circle cx="56" cy="200" r="2" opacity="0.6"/>
    <circle cx="150" cy="150" r="2" opacity="0.5"/>
    <circle cx="360" cy="130" r="1.8" opacity="0.55"/>
    <circle cx="430" cy="48" r="2.5" opacity="0.65"/>
    <circle cx="64" cy="290" r="2" opacity="0.5"/>
    <circle cx="240" cy="290" r="1.8" opacity="0.45"/>
    <circle cx="500" cy="370" r="2" opacity="0.6"/>
    <circle cx="300" cy="478" r="2.5" opacity="0.5"/>
    <circle cx="120" cy="478" r="2" opacity="0.55"/>
    <circle cx="430" cy="478" r="2" opacity="0.45"/>
    <circle cx="200" cy="420" r="1.8" opacity="0.5"/>
  </g>
  <!-- 金色星点 -->
  <g fill="#ffe9b8">
    <circle cx="176" cy="102" r="2" opacity="0.75"/>
    <circle cx="336" cy="240" r="2" opacity="0.6"/>
    <circle cx="88" cy="360" r="2" opacity="0.5"/>
    <circle cx="470" cy="320" r="1.8" opacity="0.55"/>
  </g>
  <!-- 十字闪光星（亮星） -->
  <g fill="#ffffff">
    <g opacity="0.95">
      <circle cx="120" cy="210" r="3.2"/>
      <line x1="120" y1="201" x2="120" y2="219" stroke="#ffffff" stroke-width="1.4" opacity="0.8"/>
      <line x1="111" y1="210" x2="129" y2="210" stroke="#ffffff" stroke-width="1.4" opacity="0.8"/>
    </g>
    <g opacity="0.9">
      <circle cx="395" cy="330" r="2.6"/>
      <line x1="395" y1="323" x2="395" y2="337" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
      <line x1="388" y1="330" x2="402" y2="330" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>
    </g>
  </g>

  <!-- ===== 天琴座彩蛋（左上角，主星=织女） ===== -->
  <g stroke="#cfe9ff" stroke-width="1" opacity="0.5" stroke-dasharray="2 4" fill="none">
    <path d="M210 96 L186 138 L210 170 L234 138 Z"/>
    <line x1="210" y1="96" x2="210" y2="170"/>
  </g>
  <g fill="#cfe9ff">
    <circle cx="210" cy="96" r="3"/>
    <circle cx="186" cy="138" r="2.2"/>
    <circle cx="210" cy="170" r="2.2"/>
    <circle cx="234" cy="138" r="2.2"/>
  </g>

  <!-- ===== 水面（细亮线 + 涟漪） ===== -->
  <line x1="56" y1="350" x2="456" y2="350" stroke="#8fd0ff" stroke-width="1.6" opacity="0.4"/>
  <line x1="56" y1="357" x2="456" y2="357" stroke="#8fd0ff" stroke-width="0.8" opacity="0.18"/>
  <g stroke="#8fd0ff" stroke-width="1" fill="none" opacity="0.22">
    <path d="M120 372 q 14 -5 28 0"/>
    <path d="M300 384 q 14 -5 28 0"/>
    <path d="M180 398 q 12 -4 24 0"/>
    <path d="M380 402 q 12 -4 24 0"/>
  </g>

  <!-- ===== 主体：声波律动 ===== -->
  <g id="waveGroup">
    <!-- 弱背景律动（宽光晕带） -->
    <path d="M84 350 L130 296 L176 320 L230 244 L280 278 L336 196 L390 236 L432 122"
          fill="none" stroke="url(#wm)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
    <!-- 副旋律 1（紫） -->
    <path d="M64 350 L112 316 L164 344 L220 268 L272 302 L330 222 L384 258 L440 142"
          fill="none" stroke="url(#ws)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    <!-- 副旋律 2（青，更淡更细） -->
    <path d="M140 350 L186 328 L234 352 L286 286 L336 316 L392 246 L430 272"
          fill="none" stroke="#9adcff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
    <!-- 主旋律 -->
    <path d="M84 350 L130 296 L176 320 L230 244 L280 278 L336 196 L390 236 L432 122"
          fill="none" stroke="url(#wm)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 主旋律高光 -->
    <path d="M84 350 L130 296 L176 320 L230 244 L280 278 L336 196 L390 236 L432 122"
          fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"/>
    <!-- 转折点光点 + 光晕 -->
    <g fill="#ffffff">
      <circle cx="130" cy="296" r="5" opacity="0.95"/>
      <circle cx="176" cy="320" r="3.5" opacity="0.7"/>
      <circle cx="230" cy="244" r="5.5" opacity="0.95"/>
      <circle cx="280" cy="278" r="3.5" opacity="0.7"/>
      <circle cx="336" cy="196" r="6" opacity="0.95"/>
      <circle cx="390" cy="236" r="3.5" opacity="0.7"/>
    </g>
    <g fill="url(#dotH)">
      <circle cx="130" cy="296" r="11" opacity="0.5"/>
      <circle cx="230" cy="244" r="12" opacity="0.5"/>
      <circle cx="336" cy="196" r="13" opacity="0.55"/>
    </g>
  </g>

  <!-- ===== 倒影 ===== -->
  <g transform="matrix(1 0 0 -1 0 700)" filter="url(#blurL)" mask="url(#refMask)">
    <use href="#waveGroup"/>
  </g>

  <!-- ===== 主星（织女星 · 16 芒） ===== -->
  <g>
    <!-- 外层光晕（模糊） -->
    <circle cx="432" cy="110" r="60" fill="url(#haloB)" filter="url(#blurS)"/>
    <!-- 中层光晕 -->
    <circle cx="432" cy="110" r="46" fill="url(#haloA)"/>
    <!-- 16 道星芒 -->
    <g stroke="#ffe9b8" stroke-linecap="round">
      <line x1="432" y1="52" x2="432" y2="72" stroke-width="4.5" opacity="0.95"/>
      <line x1="432" y1="148" x2="432" y2="168" stroke-width="4.5" opacity="0.95"/>
      <line x1="376" y1="110" x2="396" y2="110" stroke-width="4.5" opacity="0.95"/>
      <line x1="468" y1="110" x2="488" y2="110" stroke-width="4.5" opacity="0.95"/>
      <line x1="393" y1="71" x2="406" y2="84" stroke-width="2.8" opacity="0.85"/>
      <line x1="458" y1="71" x2="471" y2="84" stroke-width="2.8" opacity="0.85"/>
      <line x1="393" y1="149" x2="406" y2="136" stroke-width="2.8" opacity="0.85"/>
      <line x1="458" y1="149" x2="471" y2="136" stroke-width="2.8" opacity="0.85"/>
      <line x1="409" y1="58" x2="417" y2="68" stroke-width="2" opacity="0.7"/>
      <line x1="447" y1="58" x2="455" y2="68" stroke-width="2" opacity="0.7"/>
      <line x1="409" y1="162" x2="417" y2="152" stroke-width="2" opacity="0.7"/>
      <line x1="447" y1="162" x2="455" y2="152" stroke-width="2" opacity="0.7"/>
      <line x1="386" y1="92" x2="394" y2="99" stroke-width="2" opacity="0.7"/>
      <line x1="470" y1="92" x2="478" y2="99" stroke-width="2" opacity="0.7"/>
      <line x1="386" y1="128" x2="394" y2="121" stroke-width="2" opacity="0.7"/>
      <line x1="470" y1="128" x2="478" y2="121" stroke-width="2" opacity="0.7"/>
    </g>
    <!-- 星体（3 层） -->
    <circle cx="432" cy="110" r="13" fill="#ffe9b8"/>
    <circle cx="432" cy="110" r="8" fill="#fff0cd"/>
    <circle cx="428" cy="106" r="3.5" fill="#fffdf4"/>
    <!-- 星轨虚线 -->
    <path d="M446 120 Q 466 152 480 186" fill="none" stroke="#ffe9b8" stroke-width="1.6" stroke-dasharray="3 6" opacity="0.45"/>
  </g>
</svg>
